name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: Smart-Surveillance-System

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: Smart-Surveillance-System/.nvmrc
          cache: npm
          cache-dependency-path: Smart-Surveillance-System/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Generated JSON Schema is committed and current
        run: |
          npm run export-schema
          git diff --exit-code contracts/event.schema.json

  integration:
    # Real Mosquitto + Redis + Postgres, real services, no mocks.
    runs-on: ubuntu-latest
    needs: node
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: intellisafe
          POSTGRES_PASSWORD: intellisafe
          POSTGRES_DB: intellisafe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U intellisafe" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: Smart-Surveillance-System/.nvmrc
          cache: npm
          cache-dependency-path: Smart-Surveillance-System/package-lock.json
      - run: npm ci
      - name: Start Mosquitto
        run: |
          docker run -d --name mosquitto -p 1883:1883 \
            -v "$PWD/infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" eclipse-mosquitto:2
          sleep 3
      - run: npm run test:integration -w @intellisafe/api
        env:
          INTEGRATION: "1"
          MQTT_URL: mqtt://localhost:1883
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgres://intellisafe:intellisafe@localhost:5432/intellisafe

  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Smart-Surveillance-System/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest edge -q

  docker:
    runs-on: ubuntu-latest
    needs: node
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: |
          docker build -f infra/node.Dockerfile --target bridge -t intellisafe-bridge .
          docker build -f infra/node.Dockerfile --target simulator -t intellisafe-simulator .
          docker build -f infra/node.Dockerfile --target api -t intellisafe-api .
          docker build -f infra/frontend.Dockerfile -t intellisafe-frontend .
      - name: Compose smoke test (simulate -> dashboard API)
        run: |
          docker compose -f infra/docker-compose.yml up -d
          for i in $(seq 1 40); do
            n=$(curl -sf "http://localhost:3000/api/alerts?limit=1" | python3 -c 'import sys,json; print(json.load(sys.stdin)["total"])' 2>/dev/null || echo 0)
            [ "$n" -gt 0 ] && { echo "alerts in database: $n"; exit 0; }
            sleep 3
          done
          docker compose -f infra/docker-compose.yml logs
          exit 1
      - name: Dashboard is served and proxies the API
        run: curl -sf http://localhost:8080/api/health
      - if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  # ---------------------------------------------------------------- CD
  # Only on main, only after every check above is green.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [node, integration, edge, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: api, file: infra/node.Dockerfile, target: api }
          - { name: bridge, file: infra/node.Dockerfile, target: bridge }
          - { name: simulator, file: infra/node.Dockerfile, target: simulator }
          - { name: frontend, file: infra/frontend.Dockerfile, target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (registry paths must be lowercase)
        id: img
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/intellisafe-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
        working-directory: .
      - uses: docker/build-push-action@v6
        with:
          context: Smart-Surveillance-System
          file: Smart-Surveillance-System/${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ steps.img.outputs.ref }}:${{ github.sha }}
            ${{ steps.img.outputs.ref }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # Skipped until the VM exists: set repository variable DEPLOY_ENABLED=true (see infra/README.md).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: publish
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: ${{ github.sha }}
    secrets: inherit
