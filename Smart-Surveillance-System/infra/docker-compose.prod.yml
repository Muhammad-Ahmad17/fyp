# Production override. Use together with the base file:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up --build -d
#
# - Only Caddy publishes ports (80/443). Everything else lives on the internal network.
# - Caddy gets a Let's Encrypt certificate for $DOMAIN and enforces basic auth.
# - Mosquitto requires the user/password generated by infra/scripts/gen-secrets.sh.
# - Production pulls prebuilt images from GHCR (built by CI) instead of building on the VM:
#     REGISTRY=ghcr.io/<owner> IMAGE_TAG=<commit sha|latest>
#     docker compose --env-file .env -f ... -f ... pull && docker compose ... up -d --no-build
# Needs Docker Compose >= 2.24 (uses !reset).

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?set BASIC_AUTH_USER in .env}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?run infra/scripts/gen-secrets.sh}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    image: ${REGISTRY:-ghcr.io/muhammad-ahmad17}/intellisafe-frontend:${IMAGE_TAG:-latest}
    ports: !reset []

  api:
    image: ${REGISTRY:-ghcr.io/muhammad-ahmad17}/intellisafe-api:${IMAGE_TAG:-latest}
    ports: !reset []
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:?set MQTT_USERNAME in .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}
      EVIDENCE_UPLOAD_TOKEN: ${EVIDENCE_UPLOAD_TOKEN:?set EVIDENCE_UPLOAD_TOKEN in .env}

  bridge:
    image: ${REGISTRY:-ghcr.io/muhammad-ahmad17}/intellisafe-bridge:${IMAGE_TAG:-latest}
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:?set MQTT_USERNAME in .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}

  simulator:
    image: ${REGISTRY:-ghcr.io/muhammad-ahmad17}/intellisafe-simulator:${IMAGE_TAG:-latest}
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:?set MQTT_USERNAME in .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}

  mosquitto:
    ports: !reset []
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    volumes:
      - ./mosquitto/mosquitto.prod.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -u \"$$MQTT_USERNAME\" -P \"$$MQTT_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    ports: !reset []

  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

volumes:
  mosquitto-data:
  caddy-data:
  caddy-config:
