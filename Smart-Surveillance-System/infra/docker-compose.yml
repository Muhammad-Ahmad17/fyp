# IntelliSafe software pipeline (Python platform + React dashboard):
#   simulator -> MQTT -> bridge -> Redis Streams -> api -> Postgres
#                                                            \-> WebSocket -> dashboard
#
#   docker compose -f infra/docker-compose.yml up --build
#   open http://localhost:8080

name: intellisafe

x-python: &python-build
  context: ..
  dockerfile: infra/python.Dockerfile

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intellisafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intellisafe}
      POSTGRES_DB: ${POSTGRES_DB:-intellisafe}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  bridge:
    build:
      <<: *python-build
      args: { SERVICE: bridge }
    environment:
      SERVICE: bridge
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mosquitto: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  api:
    build:
      <<: *python-build
      args: { SERVICE: api }
    environment:
      SERVICE: api
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-intellisafe}:${POSTGRES_PASSWORD:-intellisafe}@postgres:5432/${POSTGRES_DB:-intellisafe}
      REDIS_URL: redis://redis:6379
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      ENABLE_SIMULATE: ${ENABLE_SIMULATE:-true}
      EVIDENCE_DIR: /app/evidence
      EVIDENCE_UPLOAD_TOKEN: ${EVIDENCE_UPLOAD_TOKEN:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3000:3000"
    volumes:
      - evidence-data:/app/evidence/uploads
    depends_on:
      mosquitto: { condition: service_healthy }
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  simulator:
    build:
      <<: *python-build
      args: { SERVICE: simulator }
    environment:
      SERVICE: simulator
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-true}
      SIMULATOR_INTERVAL_SEC: ${SIMULATOR_INTERVAL_SEC:-2}
      SIMULATOR_DEVICE_ID: ${SIMULATOR_DEVICE_ID:-jetson-sim-01}
    depends_on:
      mosquitto: { condition: service_healthy }
      bridge: { condition: service_started }
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: infra/frontend.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  evidence-data:
